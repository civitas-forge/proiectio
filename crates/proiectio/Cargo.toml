[package]
name = "proiectio"
description = "File-projection CLI over libproiectio"
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
keywords = ["cli", "files", "manifest", "projection"]
license.workspace = true
readme.workspace = true
repository.workspace = true
# Above the workspace's: standout and clapfig both require 1.96, and the
# library alone holds the workspace floor.
rust-version = "1.96"
version.workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
clapfig.workspace = true
# The user scope's directory, resolved by the same call clapfig's own Platform
# scope makes, so the echoed path is the path the edit landed in. Clapfig keeps
# its resolved persist path private, so there is nothing to ask instead.
directories.workspace = true
libproiectio = { path = "../libproiectio", version = "1.2.0" }
# Standout takes a render-only template context as a `minijinja::Value`.
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
standout.workspace = true
toml.workspace = true

[dev-dependencies]
flate2.workspace = true
serial_test.workspace = true
standout-test.workspace = true
tar.workspace = true
tempfile.workspace = true
