[workspace]
members = ["crates/libproiectio"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/civitas-forge/proiectio"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
camino = { version = "1.2", features = ["serde1"] }
cap-std = { version = "4.0", features = ["fs_utf8"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
tempfile = "3.23"
thiserror = "2.0.17"
