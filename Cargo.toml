[workspace]
members = ["crates/libproiectio", "crates/proiectio"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/civitas-forge/proiectio"
rust-version = "1.85"
version = "0.9.0"

[workspace.dependencies]
anyhow = "1.0.100"
camino = { version = "1.2", features = ["serde1"] }
cap-primitives = "4.0"
cap-std = { version = "4.0", features = ["fs_utf8"] }
cap-tempfile = "4.0"
clap = { version = "4.5", features = ["derive"] }
clapfig = "0.23.0"
flate2 = "1.1"
minijinja = "2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serial_test = "3.2"
sha2 = "0.11"
standout = "8.1.1"
standout-dispatch = "8.1.1"
standout-test = "8.1.1"
tar = "0.4"
tempfile = "3.23"
thiserror = "2.0.17"
toml = "1.1"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13", default-features = false }
