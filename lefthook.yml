# scripts/quality runs against the whole tree, not staged files only: a
# staged-only pass can lie about unstaged edits, and it is the run GitHub
# Actions makes, so a commit and a branch are held to one contract. The docs
# hook holds what only a staged diff can answer: what this commit adds.

pre-commit:
  commands:
    docs:
      priority: 1
      run: .agents/hooks/pre-commit
    quality:
      priority: 2
      run: scripts/quality
      fail_text: Run scripts/quality, fix every failure, and stage the result.
